name: Frontend production build and dependency audit

on:
  push:
    branches: [main]
    paths:
      - "bala-fashion-rayachoty-web/frontend/**"
      - ".github/workflows/frontend-build.yml"
  pull_request:
    paths:
      - "bala-fashion-rayachoty-web/frontend/**"
      - ".github/workflows/frontend-build.yml"

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bala-fashion-rayachoty-web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
