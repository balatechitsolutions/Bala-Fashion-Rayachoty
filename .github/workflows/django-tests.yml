name: Django backend tests

on:
  push:
    branches: [main]
    paths:
      - "bala-fashion-rayachoty-web/backend/**"
      - ".github/workflows/django-tests.yml"
  pull_request:
    paths:
      - "bala-fashion-rayachoty-web/backend/**"
      - ".github/workflows/django-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bala-fashion-rayachoty-web/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bala-fashion-rayachoty-web/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test
        env:
          DEBUG: "False"
          DJANGO_SECRET_KEY: "ci-test-key"
          ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
          DATABASE_URL: ""
