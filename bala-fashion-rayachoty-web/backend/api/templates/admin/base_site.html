{% extends "admin/base_site.html" %}
{% load static %}

{% block extrastyle %}
  {{ block.super }}
  <link rel="stylesheet" href="{% static 'api/bala_admin.css' %}">
  <style>
    #nav-global .bf-admin-actions{display:flex;flex-wrap:wrap;gap:10px;padding:10px 0}
    #nav-global .bf-admin-actions a{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:9px 14px;
      border-radius:8px;background:#ffbf36;color:#102b50!important;text-decoration:none;font-weight:800;line-height:1.3}
    #nav-global .bf-admin-actions a:hover{background:#f0a900}
    @media(max-width:600px){#nav-global .bf-admin-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
      #nav-global .bf-admin-actions a{font-size:13px;padding:9px 8px;text-align:center}}
  </style>
{% endblock %}

{% block branding %}
  <div id="site-name"><a href="{% url 'admin:index' %}">Bala Fashion <span style="color:#f3b83f">Rayachoty</span></a></div>
{% endblock %}

{% block nav-global %}
  <div class="bf-admin-actions">
    <a href="{% url 'admin-user-uuids' %}">Fetch all user UUIDs</a>
    <a href="{% url 'admin:api_deliverystaff_add' %}">Add delivery staff</a>
  </div>
{% endblock %}
